<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fastify Todo Demo</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; color: #1a1a1a; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input[type="text"] { flex: 1; padding: 0.4rem 0.6rem; }
    button { padding: 0.4rem 0.8rem; cursor: pointer; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.5rem; padding: 0.3rem 0; border-bottom: 1px solid #eee; }
    li span { flex: 1; }
    li.done span { text-decoration: line-through; color: #888; }
    small { color: #888; }
  </style>
</head>
<body>
  <h1>Fastify fullstack demo — Todos</h1>
  <p><small>Static HTML/JS served by @fastify/static, talking to <code>/api/todos</code>.</small></p>

  <form id="todo-form">
    <input type="text" id="todo-title" placeholder="New todo…" required />
    <button type="submit">Add</button>
  </form>

  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list')
    const form = document.getElementById('todo-form')
    const input = document.getElementById('todo-title')

    async function load() {
      const res = await fetch('/api/todos')
      const todos = await res.json()
      list.innerHTML = ''
      for (const todo of todos) {
        const li = document.createElement('li')
        li.className = todo.done ? 'done' : ''

        const checkbox = document.createElement('input')
        checkbox.type = 'checkbox'
        checkbox.checked = todo.done
        checkbox.addEventListener('change', () => toggle(todo.id, checkbox.checked))

        const span = document.createElement('span')
        span.textContent = todo.title

        const del = document.createElement('button')
        del.textContent = '✕'
        del.addEventListener('click', () => remove(todo.id))

        li.append(checkbox, span, del)
        list.appendChild(li)
      }
    }

    async function toggle(id, done) {
      await fetch(`/api/todos/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ done }),
      })
      load()
    }

    async function remove(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' })
      load()
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault()
      const title = input.value.trim()
      if (!title) return
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title }),
      })
      input.value = ''
      load()
    })

    load()
  </script>
</body>
</html>
